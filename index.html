
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Father Day 💖✌️</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      max-width: 320px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ddd;
      position: absolute;
    }

    .photo {
      width: 100%;
      margin-top: 20px;
      border-radius: 18px;
      display: none;
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
<audio id="birthdaySong" src="song.mp3"></audio>
  <div class="card">
    <h1 id="text">Happy Father day Baba 💖✌️</h1>
    <button id="yes" onclick="yesClicked()">Open Gift</button>
    <button id="no" onmouseover="moveNo()">Don't want it! 💔</button>

    <img src="./image.png" class="photo" id="couplePhoto" alt="asbin">
  </div>

  <script>
   function yesClicked() {
    document.getElementById("text").innerText =
        "Happy Father Day To My Hero💗";

    document.getElementById("couplePhoto").style.display = "block";
    document.getElementById("yes").style.display = "none";
    document.getElementById("no").style.display = "none";

    // Play birthday song
    document.getElementById("birthdaySong").play();
}

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }
  </script>

</body>
</html>
